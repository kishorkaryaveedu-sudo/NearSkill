name: nearskill
description: "A local skills marketplace connecting users with nearby service providers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & State
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Location & Maps (OpenStreetMap/Leaflet)
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0

  # Chat & Realtime
  uuid: ^4.5.1
  intl: ^0.19.0

  # Utilities
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  google_fonts: ^8.0.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
