<body class="bg-surface w-full min-h-screen flex flex-col items-center pt-[70px] px-margin-mobile font-body-md text-on-surface antialiased">
<!-- Header Section -->
<header class="w-full max-w-sm text-center mb-stack-lg flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mb-unit">NearSkill</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your local expertise, instantly.</p>
</header>
<!-- Toggle Container -->
<div class="w-full max-w-sm bg-surface-container-high rounded-full p-1 flex mb-stack-lg">
<button class="flex-1 h-10 bg-surface-container-lowest rounded-full shadow-sm flex items-center justify-center font-label-bold text-label-bold text-primary transition-all">
            Log In
        </button>
<button class="flex-1 h-10 rounded-full flex items-center justify-center font-label-bold text-label-bold text-on-surface-variant hover:text-on-surface transition-all">
            Sign Up
        </button>
</div>
<!-- Main Form Area -->
<main class="w-full max-w-sm flex flex-col gap-stack-md">
<!-- Email Input (Floating Label Style) -->
<div class="relative w-full group">
<label class="absolute left-4 top-2 font-label-sm text-label-sm text-outline group-focus-within:text-primary transition-colors z-10">Email Address</label>
<input class="w-full h-[60px] pt-[22px] pb-2 px-4 rounded-xl border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-transparent focus:placeholder:text-outline-variant transition-all relative z-0" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Input (Floating Label Style) -->
<div class="relative w-full group">
<label class="absolute left-4 top-2 font-label-sm text-label-sm text-outline group-focus-within:text-primary transition-colors z-10">Password</label>
<input class="w-full h-[60px] pt-[22px] pb-2 px-4 pr-12 rounded-xl border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-transparent focus:placeholder:text-outline-variant transition-all relative z-0" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center w-8 h-8 rounded-full text-outline hover:text-on-surface z-10">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="w-full flex justify-end mt-[-8px]">
<a class="font-label-bold text-label-bold text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[52px] bg-primary text-on-primary rounded-xl font-label-bold text-label-bold shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center mt-stack-sm">
            Log In
        </button>
</main>
<!-- Divider Section -->
<div class="w-full max-w-sm flex items-center gap-4 my-stack-lg">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline">or continue with</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Social Logins -->
<div class="w-full max-w-sm flex flex-col gap-stack-md pb-stack-lg">
<button class="w-full h-[52px] bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-3 font-label-bold text-label-bold text-on-surface active:bg-surface-container-high transition-colors">
