<body class="bg-background text-on-background font-body-md antialiased min-h-screen relative pb-[100px]">
<!-- Contextual Header (Task Flow - Suppresses Global Nav) -->
<header class="sticky top-0 w-full z-20 bg-surface/80 backdrop-blur-md border-b border-surface-container">
<div class="flex items-center h-[60px] px-margin-mobile">
<button aria-label="Close" class="w-[44px] h-[44px] flex items-center justify-start -ml-2 text-on-surface">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="flex-1 text-center font-h3 text-h3 text-on-surface mr-[28px]">Leave a Review</h1>
</div>
</header>
<main class="px-margin-mobile py-stack-lg flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Worker Context Card -->
<section class="bg-surface-container-lowest rounded-xl p-stack-md flex items-center gap-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-surface-container-low">
<div class="w-[56px] h-[56px] rounded-full overflow-hidden flex-shrink-0 bg-surface-container">
<img alt="Sarah Jenkins Avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a friendly female plumber in her 30s. She is smiling warmly and wearing a clean, modern navy blue work uniform. The background is a brightly lit, slightly out-of-focus modern white kitchen, conveying a sense of trustworthiness and local service. The lighting is soft and natural, fitting a high-end corporate modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcyqOZ6qNuI44tRhRzRuIb6SY8YVuADR0PAlyd7dBke8Ao_7Y1NtCbE0glOH1nPy9cGC2XC_eA8pvX4v9KWBjQR-jg51Gg3AvIrycqpBRVfWTykYwKOkKQS4aBDYM82jpKkLU_YoaXbR3_bFH44mIPeTMa3FPSzvGoJM4u3sUo0v1i-I7SDlSKzW-UXL1lmkBsClAlmdx3W2AeqF_ttxsNFlNLl8qianIqEN3yrDv9Mf_gZXcSxWMPGke_T17vCoLKM0RCCyw73cns"/>
</div>
<div class="flex flex-col">
<h2 class="font-h3 text-h3 text-on-surface">Sarah Jenkins</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">plumbing</span>
                    Plumbing Repair
                </p>
</div>
</section>
<!-- Rating Selector -->
<section class="flex flex-col items-center gap-stack-sm pt-stack-sm">
<h3 class="font-h2 text-h2 text-on-surface text-center">How was your experience?</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-2">Tap a star to rate Sarah's work.</p>
<div class="flex justify-center gap-2 w-full">
<!-- Interactive Star Row -->
<button class="w-[44px] h-[44px] flex items-center justify-center text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="w-[44px] h-[44px] flex items-center justify-center text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="w-[44px] h-[44px] flex items-center justify-center text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="w-[44px] h-[44px] flex items-center justify-center text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="w-[44px] h-[44px] flex items-center justify-center text-surface-variant transition-transform active:scale-90">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
</div>
<p class="font-label-bold text-label-bold text-primary mt-1">Great</p>
</section>
<!-- Feedback Text Area -->
<section class="flex flex-col gap-stack-sm w-full">
<label class="font-label-bold text-label-bold text-on-surface" for="feedback">Share the details</label>
<div class="relative w-full">
<textarea class="w-full bg-surface-container-low border-0 rounded-xl p-stack-md font-body-md text-body-md text-on-surface placeholder:text-outline resize-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all shadow-inner" id="feedback" placeholder="What did you like? Did Sarah arrive on time? Was the problem resolved quickly?" rows="4"></textarea>
</div>
</section>
<!-- Add Photo Button -->
<section class="w-full">
<button class="w-full flex flex-col items-center justify-center gap-stack-sm py-stack-lg border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-[44px] h-[44px] rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<div class="text-center">
<span class="block font-label-bold text-label-bold text-on-surface">Add photos</span>
<span class="block font-body-md text-body-md text-on-surface-variant text-[13px] mt-1">Optional • Show the completed work</span>
</div>
</button>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-lg border-t border-surface-container z-50 pb-safe">
<div class="p-margin-mobile max-w-md mx-auto">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-full font-label-bold text-label-bold flex items-center justify-center shadow-md active:scale-[0.98] transition-transform">
                Submit Review
            </button>
</div>
</div>
